
services:
  # ─── PostgreSQL + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ccip-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccip}
      POSTGRES_USER: ${POSTGRES_USER:-ccip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ccip-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (Gunicorn + UvicornWorker) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccip-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ccip}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ccip}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/app/scripts/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccip-celery
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ccip}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ccip}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info --concurrency=2

  # ─── Frontend (Nginx + Vite production build) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccip-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # ─── Apache Superset BI Studio ───────────────────────────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: ccip-superset
    env_file: .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset-dev-secret-key}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      DATABASE_DB: ${POSTGRES_DB:-ccip}
      DATABASE_HOST: postgres
      DATABASE_USER: ${POSTGRES_USER:-ccip}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_PORT: 5432
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/superset_config.py
      - ./superset/bootstrap.sh:/app/docker/bootstrap.sh
    command: >
      bash -c "
        pip install psycopg2-binary 2>/dev/null;
        bash /app/docker/bootstrap.sh;
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
  uploads:
  superset_home:

